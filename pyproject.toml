[project]
name = "anibis-sdk"
version = "0.1.0"
description = "Unofficial Python client for the anibis.ch GraphQL API — search, filters, listings, seller profiles, categories and suggestions. Built on tutti-sdk."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["tutti-sdk>=0.1.0"]

[project.urls]
Repository = "https://github.com/aneshodza/anibis-sdk"
Documentation = "https://aneshodza.github.io/anibis-sdk/"
Changelog = "https://github.com/aneshodza/anibis-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anibis_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the real www.anibis.ch (deselect with -m 'not live')"]

[tool.ruff]
line-length = 100
